services:
  dyniku:
    image: ${DYNIKU_IMAGE:-ghcr.io/maroishiku/dyniku:0.1.0}
    container_name: dyniku
    restart: unless-stopped
    ports:
      - "8507:8507"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - type: bind
        source: /DATA/AppData/dyniku/data
        target: /data
    secrets:
      - ishiku_setup_secret
    environment:
      ISHIKU_SETUP_SECRET_FILE: /run/secrets/ishiku_setup_secret
    healthcheck:
      test: ["CMD", "/updater/dyniku", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  ishiku_setup_secret:
    file: /DATA/AppData/dyniku/secrets/setup_secret.txt
