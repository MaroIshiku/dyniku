services:
  dyniku:
    image: ${DYNIKU_IMAGE:-ghcr.io/maroishiku/dyniku:0.3.1@sha256:42ec75dcb5d218ae8cc7f6ddbe0d43b8b777b4066e695d90da36679dde5e851f}
    container_name: dyniku
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    ports:
      - "65000:8507"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - type: bind
        source: /DATA/AppData/dyniku/data
        target: /data
    environment:
      ISHIKU_SETUP_SECRET: "REPLACE-WITH-A-UNIQUE-SECRET-OF-AT-LEAST-32-CHARACTERS"
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/updater/dyniku", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
