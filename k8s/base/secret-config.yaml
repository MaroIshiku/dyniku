apiVersion: v1
kind: Secret
metadata:
  name: dyniku-config
type: Opaque
stringData:
  ISHIKU_SETUP_SECRET: REPLACE-WITH-A-UNIQUE-SECRET-OF-AT-LEAST-32-CHARACTERS
  CONFIG: '{"settings":[{"provider":"ddnss","provider_ip":true,"domain":"YOUR-DOMAIN","owner":"@","username":"YOUR-USERNAME","password":"YOUR-PASSWORD","ip_version":"ipv4"}]}'
