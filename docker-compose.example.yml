services:
  dyniku:
    image: ${DYNIKU_IMAGE:-ghcr.io/maroishiku/dyniku:0.3.0@sha256:4ed4741a1294281d4ede33a0345bd3abf624d0b2f5e65142b6a6c5a9b9575214}
    container_name: dyniku
    restart: unless-stopped
    ports:
      - "65000:8507"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      ISHIKU_SETUP_SECRET_FILE: /run/secrets/ishiku_setup_secret
    volumes:
      - type: bind
        source: /DATA/AppData/dyniku/data
        target: /data
    secrets:
      - ishiku_setup_secret
    healthcheck:
      test: ["CMD", "/updater/dyniku", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  ishiku_setup_secret:
    file: /DATA/AppData/dyniku/secrets/setup_secret.txt
