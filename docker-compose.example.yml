services:
  dyniku:
    image: ghcr.io/maroishiku/dyniku:latest
    container_name: dyniku
    restart: unless-stopped
    ports:
      - "8507:8507"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      ISHIKU_SETUP_SECRET_FILE: /run/secrets/ishiku_setup_secret
    volumes:
      - ./data:/data
    secrets:
      - ishiku_setup_secret
    healthcheck:
      test: ["CMD", "/updater/dyniku", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  ishiku_setup_secret:
    file: ./secrets/setup_secret.txt
