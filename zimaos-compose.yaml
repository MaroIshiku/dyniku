# ZimaOS-first, standard Docker Compose deployment.
# Breaking since 0.3.0: replace the setup-secret placeholder before first start.
name: dyniku
services:
  dyniku:
    image: ghcr.io/maroishiku/dyniku:0.3.1@sha256:42ec75dcb5d218ae8cc7f6ddbe0d43b8b777b4066e695d90da36679dde5e851f
    container_name: dyniku
    hostname: dyniku
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    ports:
      - target: 8507
        published: "65000"
        protocol: tcp
    environment:
      - BACKUP_DIRECTORY=/data
      - BACKUP_PERIOD=0
      - HTTP_TIMEOUT=10s
      - ISHIKU_BACKUP_DIRECTORY=/data
      - ISHIKU_BASE_PATH=/
      - ISHIKU_CONFIG_FILE=/data/config.json
      - ISHIKU_DATA_DIR=/data
      - ISHIKU_LOG_LEVEL=info
      - ISHIKU_SETUP_SECRET=REPLACE-WITH-A-UNIQUE-SECRET-OF-AT-LEAST-32-CHARACTERS
      - LISTENING_ADDRESS=:8507
      - LOG_CALLER=hidden
      - LOG_LEVEL=info
      - PERIOD=5m
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - ROOT_URL=/
      - UPDATE_COOLDOWN_PERIOD=5m
      - TZ=Europe/Berlin
    volumes:
      - type: bind
        source: /DATA/AppData/dyniku/data
        target: /data
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      icon: https://raw.githubusercontent.com/MaroIshiku/dyniku/main/assets/icon-512.png
      title.en_us: Dyniku
    x-casaos:
      envs:
        - container: ISHIKU_SETUP_SECRET
          description:
            en_us: Unique first-run setup secret with at least 32 characters
      ports:
        - container: "8507"
          description:
            en_us: Web interface on host port 65000
      volumes:
        - container: /data
          description:
            en_us: Persistent application data
x-casaos:
  id: dev.ishiku.dyniku
  architectures:
    - amd64
    - arm64
  main: dyniku
  author: self
  category: Network
  developer: ishiku
  hostname: ""
  icon: https://raw.githubusercontent.com/MaroIshiku/dyniku/main/assets/icon-512.png
  index: /
  is_uncontrolled: false
  port_map: "65000"
  repo: https://github.com/MaroIshiku/dyniku
  scheme: http
  store_app_id: dyniku
  tagline:
    en_us: Self-hosted dynamic DNS management
  description:
    en_us: Manage, execute, and observe dynamic DNS updates through a private web interface.
  title:
    custom: Dyniku
    en_us: Dyniku
