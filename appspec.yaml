{
  "schema_version": 1,
  "application": {
    "id": "dyniku",
    "name": "Dyniku",
    "family": "ishiku",
    "locale": "en"
  },
  "summary": "Manage, execute, and observe dynamic DNS updates through a self-hosted web interface.",
  "requirements": [
    {
      "id": "CORE-001",
      "title": "Core product behavior",
      "priority": "critical",
      "acceptance": [
        "Manage, execute, and observe dynamic DNS updates through a self-hosted web interface.",
        "Existing documented and reachable behavior remains available unless an approved migration decision says otherwise."
      ],
      "security_critical": false
    },
    {
      "id": "AUTH-001",
      "title": "Secure account access",
      "priority": "critical",
      "acceptance": [
        "Account authentication uses generic errors, rate limits, and a supported password hash.",
        "Sessions are server-side revocable, rotated, time-bounded, cookie-protected, and CSRF-protected."
      ],
      "security_critical": true
    },
    {
      "id": "UI-001",
      "title": "Consistent English interface",
      "priority": "high",
      "acceptance": [
        "All user-facing interface text is English.",
        "The app uses ishiku semantic tokens, shared layout contracts, responsive behavior, and WCAG 2.2 AA interaction.",
        "Launcher, browser, catalog, and repository consumers use the approved Dyniku icon source and its direct raster exports."
      ],
      "security_critical": false
    },
    {
      "id": "OPS-001",
      "title": "Safe standalone operation",
      "priority": "high",
      "acceptance": [
        "A fresh clone can build, test, and run without the outer workspace.",
        "Health checks, persistent data, runtime secrets, backup, restore, and upgrade procedures are verifiable.",
        "Primary standalone and ZimaOS Compose delivery publishes host port 65000 while preserving container port 8507.",
        "Every published deployment artifact and its metadata uses the centrally assigned host port 65000."
      ],
      "security_critical": true
    },
    {
      "id": "DEPLOY-001",
      "title": "Breaking ZimaOS deployment contract",
      "priority": "critical",
      "acceptance": [
        "Version 0.3.0 is an approved breaking deployment change with documented migration and rollback instructions.",
        "The primary ZimaOS Compose uses direct scalar values, an immutable version-and-digest image reference, and no interpolation variables.",
        "The primary ZimaOS Compose contains only a synthetic ISHIKU_SETUP_SECRET replacement value of at least 32 characters and requires the operator to replace it before first start.",
        "Standard Docker Compose keeps the runtime secret-file profile while defaulting to the same immutable release image."
      ],
      "security_critical": true
    },
    {
      "id": "REL-001",
      "title": "Reproducible release",
      "priority": "high",
      "acceptance": [
        "Pull requests and releases use clone-local verification scripts.",
        "Released images are immutable, scanned, SBOM-equipped, provenance-attested, and rollback-documented."
      ],
      "security_critical": true
    }
  ]
}
